<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
</head>

<body>

    <div class="main">
        <div class="overlay">

            <div class="title">We are coming soon</div>

            <!-- User selects date and time -->
            <input type="datetime-local" id="dateInput">
            <button onclick="startClock()">Start Countdown</button>

            <div class="title" id="endDate"></div>

            <div class="col">

                <div>
                    <input type="text" readonly value="0">
                    <br/>
                    <label>Days</label>
                </div>

                <div>
                    <input type="text" readonly value="0">
                    <br/>
                    <label>Hours</label>
                </div>

                <div>
                    <input type="text" readonly value="0">
                    <br/>
                    <label>Minutes</label>
                </div>

                <div>
                    <input type="text" readonly value="0">
                    <br/>
                    <label>Seconds</label>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
